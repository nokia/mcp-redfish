name: Build and Publish Container Image

on:
  push:
    tags:
      - 'v*'
    # Push runs this file from the branch itself, before it is on main.
    # workflow_dispatch cannot: GitHub registers that button only from the
    # default branch. Remove this branch entry after the copy has been tested.
    branches:
      - ghcr-nokia-steward
  pull_request:
    branches:
      - main
  # Copies tags already published at ghcr.io/nokia/mcp-redfish into this
  # repository's package. A repo transfer does not move GHCR packages.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Existing users pull :latest from this path. Version tags are published
  # only to IMAGE_NAME. GITHUB_TOKEN cannot push outside this repository's
  # owner, so :latest is mirrored with the nokia GitHub App.
  LEGACY_IMAGE_NAME: nokia/mcp-redfish
  LEGACY_REGISTRY_USERNAME: x-access-token

jobs:
  build-and-push:
    if: github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/ghcr-nokia-steward'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write  # For cosign signing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Log in to Container Registry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
          provenance: mode=max

      - name: Sign container image with Cosign
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          # Sign once by digest; all pushed tags resolve to this manifest.
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      - name: Install skopeo
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Require legacy GitHub App credentials
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          APP_ID: ${{ secrets.GHCR_LEGACY_APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.GHCR_LEGACY_APP_PRIVATE_KE }}
        run: |
          if [ -z "${APP_ID}" ] || [ -z "${APP_PRIVATE_KEY}" ]; then
            echo "::error::Set GHCR_LEGACY_APP_ID and GHCR_LEGACY_APP_PRIVATE_KE so releases also publish ghcr.io/${{ env.LEGACY_IMAGE_NAME }}."
            exit 1
          fi

      - name: Create legacy registry token
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        id: legacy-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.GHCR_LEGACY_APP_ID }}
          private-key: ${{ secrets.GHCR_LEGACY_APP_PRIVATE_KE }}
          owner: nokia
          permission-packages: write

      - name: Mirror latest tag to ghcr.io/nokia/mcp-redfish
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          SRC_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DST_IMAGE: ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}
          SRC_USERNAME: ${{ github.actor }}
          SRC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DST_USERNAME: ${{ env.LEGACY_REGISTRY_USERNAME }}
          DST_TOKEN: ${{ steps.legacy-token.outputs.token }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          publish_latest=0
          while IFS= read -r ref; do
            if [ "${ref##*:}" = "latest" ]; then
              publish_latest=1
            fi
          done <<< "${TAGS}"
          if [ "${publish_latest}" -ne 1 ]; then
            echo "No latest tag on this release. Version tags stay on ${SRC_IMAGE}."
            exit 0
          fi
          TAGS=latest ./scripts/mirror_ghcr.sh "${SRC_IMAGE}" "${DST_IMAGE}"

      - name: Sign legacy container image with Cosign
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          COSIGN_EXPERIMENTAL: 1
          LEGACY_USERNAME: ${{ env.LEGACY_REGISTRY_USERNAME }}
          LEGACY_TOKEN: ${{ steps.legacy-token.outputs.token }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          publish_latest=0
          while IFS= read -r ref; do
            if [ "${ref##*:}" = "latest" ]; then
              publish_latest=1
            fi
          done <<< "${TAGS}"
          if [ "${publish_latest}" -ne 1 ]; then
            echo "No latest tag on this release. Skipping the legacy signature."
            exit 0
          fi
          digest="$(
            skopeo inspect --format '{{.Digest}}' \
              --creds "${LEGACY_USERNAME}:${LEGACY_TOKEN}" \
              "docker://${REGISTRY}/${LEGACY_IMAGE_NAME}:latest"
          )"
          echo "${LEGACY_TOKEN}" | docker login "${REGISTRY}" \
            --username "${LEGACY_USERNAME}" --password-stdin
          cosign sign --yes "${REGISTRY}/${LEGACY_IMAGE_NAME}@${digest}"

  copy-existing-package:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/ghcr-nokia-steward'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install skopeo
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Create legacy registry token
        id: legacy-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.GHCR_LEGACY_APP_ID }}
          private-key: ${{ secrets.GHCR_LEGACY_APP_PRIVATE_KE }}
          owner: nokia
          permission-packages: write

      - name: Copy ghcr.io/nokia/mcp-redfish into this repository
        env:
          SRC_IMAGE: ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}
          DST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          SRC_USERNAME: ${{ env.LEGACY_REGISTRY_USERNAME }}
          SRC_TOKEN: ${{ steps.legacy-token.outputs.token }}
          DST_USERNAME: ${{ github.actor }}
          DST_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_EXISTING: "1"
        run: |
          ./scripts/mirror_ghcr.sh "${SRC_IMAGE}" "${DST_IMAGE}"
          echo "Package tags were copied to ${DST_IMAGE}."
          echo "If the package is private, open it on GitHub and change visibility to match ghcr.io/nokia/mcp-redfish."
